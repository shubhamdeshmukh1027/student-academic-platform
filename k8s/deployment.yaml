apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-platform-deployment
  labels:
    app: student-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-platform
  template:
    metadata:
      labels:
        app: student-platform
    spec:
      containers:
        - name: student-platform
          image: student-academic-platform:v1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
